# Builds the Site Right Android APK from this branch.
#
# Signing: if the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets are set, the APK is
# zipaligned and signed with that keystore (must be the same keystore that
# signed v17 — CN=Ian Shaw, created 2024-09-11 — or phones will refuse the
# update). Without the secrets it uploads an unsigned APK artifact only.
#
# Releasing: pass a release_tag (e.g. v18) to publish the signed APK to
# Ianshaw93/fd-mobile-releases. Requires the RELEASE_REPO_TOKEN secret
# (a PAT with repo scope on fd-mobile-releases). Refuses to release unsigned.

name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release to fd-mobile-releases (e.g. v18). Leave empty for artifact-only build."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # The in-app updater treats the release tag as the versionCode of the
      # attached APK. A tag that doesn't match build.gradle either re-prompts
      # every device forever (tag too high) or is never offered (tag too low
      # or malformed). Fail fast, before the ten-minute build.
      - name: Verify release tag matches versionCode
        if: inputs.release_tag != ''
        run: |
          TAG="${{ inputs.release_tag }}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+$'; then
            echo "::error::release_tag must be exactly vN (got '$TAG') — the updater skips anything else."
            exit 1
          fi
          CODE=$(grep -oP 'versionCode\s+\K[0-9]+' android/app/build.gradle | head -1)
          if [ "v$CODE" != "$TAG" ]; then
            echo "::error::release_tag '$TAG' does not match versionCode $CODE in android/app/build.gradle."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run static

      - name: Capacitor sync
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Sign APK
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks keystore.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out app-release.apk \
            aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs app-release.apk
          rm -f keystore.jks

      - name: Collect unsigned APK
        if: env.KEYSTORE_B64 == ''
        run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk app-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: site-right-apk
          path: |
            app-release.apk
            app-release-unsigned.apk
          if-no-files-found: error

      - name: Release to fd-mobile-releases
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          if [ ! -f app-release.apk ]; then
            echo "::error::Refusing to release an unsigned APK — add the keystore secrets first."
            exit 1
          fi
          gh release create "${{ inputs.release_tag }}" app-release.apk \
            --repo Ianshaw93/fd-mobile-releases \
            --title "${{ inputs.release_tag }}" \
            --notes "Release ${{ inputs.release_tag }} (built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME})"
