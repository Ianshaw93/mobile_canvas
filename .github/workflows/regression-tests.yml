name: Regression tests
on:
  push:
    paths: ['services/**', 'utils/**', 'components/**', 'hooks/**', 'tests/**', 'package*.json', 'jest.config.js', 'tsconfig.json', '.github/workflows/regression-tests.yml']
  pull_request:
    paths: ['services/**', 'utils/**', 'components/**', 'hooks/**', 'tests/**', 'package*.json', 'jest.config.js', 'tsconfig.json', '.github/workflows/regression-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit and service integration tests (offline)
        run: npm test -- --runInBand
      - name: Native test helper and live-canary write policy (offline)
        run: |
          node tests/e2e/adb.test.js
          node tests/e2e/live-recovery-policy.test.js
      - name: Type check
        run: npx tsc --noEmit --incremental false
