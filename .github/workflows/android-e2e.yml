# Runs tests/e2e/android.js against a debug APK on a headless Android emulator.
#
# Why: the browser e2e only ever hits the `web` branches of the app. This job
# boots the real APK (native SQLite plugin, @capacitor/filesystem, Preferences)
# and drives it over Chrome DevTools on the WebView, so a migration or storage
# bug that only shows on device fails here instead of on site.
#
# Runs on pushes to cloud/main and PRs touching app code (or by hand) and is called by
# build-apk.yml as a gate before a release is published. ubuntu-latest has
# KVM, so the x86_64 system image runs at near-native speed; a cold run is
# ~10 min, a cached one ~6.

name: Android E2E

on:
  workflow_dispatch:
    inputs:
      test_upgrade:
        description: "Test v20 to candidate upgrade with native fixture data retained"
        type: boolean
        default: false
      reuse_upgrade_apks_run:
        description: "Reuse upgrade APK artifacts from a prior test run (test harness reruns only)"
        type: string
        default: ""
  workflow_call:
  push:
    branches: [cloud, main]
    paths:
      - "components/**"
      - "pages/**"
      - "services/**"
      - "store/**"
      - "utils/**"
      - "hooks/**"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "tests/e2e/**"
      - ".github/workflows/android-e2e.yml"
  pull_request:
    paths:
      - "components/**"
      - "pages/**"
      - "services/**"
      - "store/**"
      - "utils/**"
      - "hooks/**"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "tests/e2e/**"
      - ".github/workflows/android-e2e.yml"

env:
  API_LEVEL: 34
  # Known working build from the v20 -> v25 upgrade run. Google's latest
  # emulator package can change or be unavailable independently of app code.
  EMULATOR_BUILD: 15917651
  # A tablet profile: the plan canvas renders at ~1263x893 CSS px and the
  # script double-clicks on the visible part of it. Landscape pixel_c gives
  # 1280x900 CSS px so all three pin positions stay on screen.
  AVD_PROFILE: pixel_c

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit-test the adb helper
        run: node tests/e2e/adb.test.js

      - name: Restore upgrade APK test artifacts
        if: inputs.reuse_upgrade_apks_run != ''
        uses: actions/download-artifact@v4
        with:
          name: android-upgrade-apks
          path: ${{ runner.temp }}/upgrade
          run-id: ${{ inputs.reuse_upgrade_apks_run }}
          github-token: ${{ github.token }}

      - name: Build web assets
        if: inputs.reuse_upgrade_apks_run == ''
        run: npm run static

      - name: Capacitor sync
        if: inputs.reuse_upgrade_apks_run == ''
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Debug build: WebView remote debugging is on by default for debuggable
      # APKs (Capacitor's CapConfig reads FLAG_DEBUGGABLE), which is what the
      # script connects to. The release APK is built and signed separately.
      - name: Build debug APK
        if: inputs.reuse_upgrade_apks_run == ''
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Build v20 upgrade baseline
        if: inputs.test_upgrade == true && inputs.reuse_upgrade_apks_run == ''
        run: |
          mkdir -p "$RUNNER_TEMP/upgrade"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/upgrade/new.apk"
          git worktree add --detach "$RUNNER_TEMP/upgrade/baseline" 35366e9
          cd "$RUNNER_TEMP/upgrade/baseline"
          npm ci
          npm run static
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/upgrade/old.apk"

      - name: Save upgrade APK test artifacts
        if: inputs.test_upgrade == true
        uses: actions/upload-artifact@v4
        with:
          name: android-upgrade-apks
          path: ${{ runner.temp }}/upgrade/*.apk
          retention-days: 3

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          emulator-build: ${{ env.EMULATOR_BUILD }}
          target: google_apis
          arch: x86_64
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"

      - name: Run Android e2e
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_APK: ${{ inputs.test_upgrade && format('{0}/upgrade/old.apk', runner.temp) || '' }}
          E2E_UPGRADE_APK: ${{ inputs.test_upgrade && format('{0}/upgrade/new.apk', runner.temp) || '' }}
        with:
          api-level: ${{ env.API_LEVEL }}
          emulator-build: ${{ env.EMULATOR_BUILD }}
          target: google_apis
          arch: x86_64
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb devices
            node tests/e2e/android.js
            E2E_RECOVERY_OFFLINE=1 E2E_OUT=e2e-out/recovery node tests/e2e/live-recovery.js

      - name: Upload screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: e2e-out/
          if-no-files-found: ignore
